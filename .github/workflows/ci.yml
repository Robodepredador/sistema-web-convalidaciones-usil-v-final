name: CI/CD - Convalidaciones USIL

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: convalidaciones_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, bcmath, gd, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: convalidaciones_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: convalidaciones_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Vulnerabilidades en dependencias PHP
        run: composer audit

      - name: Run tests
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: convalidaciones_test
          DB_USERNAME: root
          DB_PASSWORD: root
          QUEUE_CONNECTION: sync

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Build frontend
        run: npm ci && npm run build

      - name: Vulnerabilidades en dependencias JS
        run: npm audit --omit=dev

# El despliegue es MANUAL y está descrito en deploy/RUNBOOK.md.
#
# Antes existían aquí dos jobs (deploy-qa y deploy-prod) que solo ejecutaban
# `echo "Desplegando..."`: daban por verde un despliegue que nunca ocurría. Se
# retiraron en lugar de dejarlos simulados. Para automatizarlo hay que definir
# los secretos del entorno (host, clave SSH o registro de imágenes) y sustituir
# el procedimiento del runbook por los pasos equivalentes.
