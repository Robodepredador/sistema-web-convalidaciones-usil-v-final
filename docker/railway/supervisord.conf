; Railway corre un solo contenedor por servicio: Apache y el worker de colas
; conviven aquí porque el worker lee del mismo volumen los Excel que sube la web
; (ImportarMallaExcel usa Storage::path, que exige disco local).
;
; Los logs van a stdout: Railway no da acceso al sistema de archivos, su consola
; es lo único que se puede leer.

[program:apache]
command=apache2-foreground
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
; Mismo comando que docker/supervisor/queue-worker.conf, pero con numprocs=1:
; aquí el worker comparte CPU con Apache y más procesos competirían con las
; peticiones web. stopwaitsecs > timeout para no cortar una carga a media faena.
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --timeout=600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=620
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
